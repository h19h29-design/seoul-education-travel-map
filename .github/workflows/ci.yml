name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: apps/travel-map/uv.lock
      - name: Install locked dependencies
        run: uv sync --project apps/travel-map --frozen --dev
      - name: Test with warnings as errors
        env:
          PYTHONWARNINGS: error
        run: uv run --project apps/travel-map pytest apps/travel-map/tests -q
      - name: Lint
        run: uv run --project apps/travel-map ruff check apps/travel-map
      - name: Type check
        env:
          MYPYPATH: apps/travel-map
        run: uv run --project apps/travel-map mypy apps/travel-map/app apps/travel-map/scripts

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: apps/travel-map/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/travel-map/pnpm-lock.yaml
      - name: Install locked dependencies
        run: |
          uv sync --project apps/travel-map --frozen --dev
          pnpm --dir apps/travel-map install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir apps/travel-map exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm --dir apps/travel-map test:e2e
